server {
    listen 80;
    server_name localhost;

    # バックエンドAPIへのプロキシ設定
    # /api/ から始まるリクエストを backend (PHP-FPM) へプロキシ
    location /api {
        # # 💡 修正点 1: Laravelのドキュメントルートを設定
        # # コンテナ内のLaravelのpublicディレクトリを指定
        # root /var/www/html/backend/public;

        # # 💡 修正点 2: URLから /api プレフィックスを取り除く
        # # Laravelアプリケーションは /api を含まないパス（例: /users）で処理される
        # # rewrite ^/api(.*)$ $1 break;

        # # 💡 修正点 3: index.php が存在しないパスは index.php に渡す
        # # これがLaravelのルーティングの要（Try Files）
        # try_files $uri $uri/ /index.php?$query_string;

        # # PHP-FPMへの転送設定
        # fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # fastcgi_pass backend:9000;
        # fastcgi_index index.php;

        # # 💡 修正点 4: SCRIPT_FILENAME を public/index.php に明示的に設定
        # fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # # fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name; # 厳密にはこちら
        # fastcgi_param PATH_INFO $fastcgi_path_info;
        # include fastcgi_params;
        proxy_pass http://backend:9000; # ← php-fpmコンテナ名:port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 💡 (追加) /index.php の直接実行を処理するlocationブロック
    # 上記の /api ブロック内の try_files で /index.php に到達した場合、
    # その処理を適切に行うためのブロックを追加します。
    # location ~ \.php$ {
    #     fastcgi_pass backend:9000;
    #     fastcgi_index index.php;
    #     fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #     include fastcgi_params;
    # }

    location / {
            # # ----------------------------------------------------
            # # 1. リクエストをVue開発サーバーへ転送する (リバースプロキシ)
            # # ----------------------------------------------------
            # # デフォルトのVite/Vue CLI開発サーバーのアドレスを指定します。
            # # 例: Viteの場合は通常5173, Vue CLIの場合は通常8080
            # proxy_pass http://frontend:5173;

            # # ----------------------------------------------------
            # # 2. リバースプロキシに必要なヘッダーの設定
            # # ----------------------------------------------------
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

            # # ----------------------------------------------------
            # # 3. WebSocket (HMR) の有効化
            # # ----------------------------------------------------
            # # 開発サーバーのHMR (Hot Module Replacement) を機能させるために必須です。
            # proxy_http_version 1.1;
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection "upgrade";
            proxy_pass http://backend:9000; # ← php-fpmコンテナ名:port
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

      location ~ \.php$ {
        # FastCGIプロトコルを使用してPHP-FPMに接続
        # 環境に合わせてIPアドレスとポート番号を変更してください。
        # (例: UNIXソケットを使用する場合: fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;)
        fastcgi_pass backend:9000;

        # index.phpをフロントコントローラーとして設定
        fastcgi_index index.php;

        # リクエストURIをindex.phpに渡す
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 必須のFastCGIパラメーターを含める
        include fastcgi_params;

        # LaravelやSymfonyなど、多くのPHPフレームワークで使用される
        # PATH_INFOを空にしておくための設定
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
      }
}

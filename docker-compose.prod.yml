version: '3.8'

# baseファイルを継承
services:
  # データベースサービス (MySQL)
  db:
    restart: always # 自動再起動を有効化
    # 本番用の設定ファイルをマウント（任意）
    # volumes:
    #   - ./mysql/prod.cnf:/etc/mysql/conf.d/prod.cnf
  # Laravel (Backend) サービス
  backend:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile.prod
    container_name: backend_prod
    # 本番ではボリュームマウントは不要（Dockerfileでビルド成果物まで含めるため）
    volumes:
      - backend_storage:/var/www/html/storage # storageディレクトリの永続化
    environment:
      DB_HOST: db
      DB_PORT: 3306
      # 環境変数 APP_ENV: production など
    # 本番では直接ポート公開せず、Nginxコンテナ経由とする（ここでは省略）
    depends_on:
      - db
    networks:
      - app-network

  # Vue (Frontend) サービス (静的ファイル配信用のNginx)
  frontend_nginx:
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile.prod
    container_name: frontend_prod
    ports:
      - "80:80" # Webアクセス用ポート
    networks:
      - app-network

  # dbサービスはbaseファイルから継承される

volumes:
  dbdata:
  backend_storage: # Laravelのストレージ用ボリューム

networks:
  app-network:
    driver: bridge
